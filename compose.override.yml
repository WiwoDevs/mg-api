# Ajustes de produccion, aparte de compose.yml para que el archivo base sirva
# igual en local. Docker Compose lo mezcla solo, y el flujo de despliegue lo
# nombra de forma explicita.
services:
  mgapi:
    logging:
      driver: json-file
      options:
        # Sin limite, los logs llenan el disco del VPS y el servicio cae por
        # una razon que no tiene nada que ver con el codigo.
        max-size: "10m"
        max-file: "5"

  caddy:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
